services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Docker socket proxy.
  #
  # The verifier needs to start and stop throwaway containers. Giving
  # the orchestrator direct access to /var/run/docker.sock would be
  # equivalent to root on the host — the container could start
  # privileged containers, mount arbitrary host paths, run as any user.
  #
  # This proxy exposes a narrower API surface than the raw socket:
  # container create/start/exec/attach/logs and image pull are allowed;
  # volumes, networks, build, secrets, swarm, and system endpoints are
  # not. That's meaningful reduction.
  #
  # It is NOT a sandbox. Tecnativa filters by endpoint and HTTP method,
  # not by request body — a POST /containers/create with
  # "Privileged": true would still go through. The proxy is
  # defense-in-depth on top of the verifier's own argv discipline
  # (see _run_in_docker in src/agents/verifier.py, where every docker
  # run argument is asserted to come from config or generated values,
  # never from customer input).
  #
  # Not safe for multi-tenant production. The correct answer there is
  # to run verification on the customer's own infrastructure via a
  # phone-home runner reached over an API — not by giving the
  # orchestrator a Docker daemon socket. That path is designed but not
  # yet implemented. See issue #101.

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: aegis-docker-proxy
    environment:
      # Endpoints the verifier needs.
      CONTAINERS: "1"   # create, start, kill, remove, list
      IMAGES: "1"       # pull base images
      POST: "1"         # allow the mutating verbs above
      EXEC: "1"         # exec into a container
      ATTACH: "1"       # stream stdout/stderr from `docker run`
      LOGS: "1"         # `docker logs` for post-hoc capture
      # Explicitly blocked (defaults; listed for clarity).
      VOLUMES: "0"      # cannot create arbitrary volumes
      NETWORKS: "0"     # cannot attach to other networks
      INFO: "0"         # cannot enumerate host-level Docker state
      SYSTEM: "0"       # cannot call docker system *
      SWARM: "0"        # not a swarm deployment
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  orchestrator:
    build: ./backend/orchestrator
    container_name: aegis-orchestrator
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8000:8000"
    env_file:
      - ./backend/orchestrator/.env
    environment:
      DEMO_MODE: ${DEMO_MODE:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_FALLBACKS: ${LLM_FALLBACKS-gemini,openrouter}
      AUTO_FIX_MODE: ${AUTO_FIX_MODE:-read_only}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Hugging Face cache. The orchestrator runs as a non-root user
      # (see `user:` above), so the library's default cache location
      # (/.cache) isn't writable. Point it at the named volume.
      HOME: /home/aegis
      HF_HOME: /home/aegis/.cache/huggingface
      # Talk to the Docker daemon via the socket proxy — never the
      # raw /var/run/docker.sock.
      DOCKER_HOST: tcp://docker-proxy:2375
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/orchestrator:/app
      - /app/__pycache__
      - ./database:/database:ro
      # Verifier workdir. Shared between the host and the container
      # so the orchestrator can hand the daemon a path that resolves
      # on the host. The daemon interprets -v paths against the host,
      # not against this container — see the Docker-out-of-Docker
      # note in src/agents/verifier.py.
      - ./verifier-workdir:/verifier-workdir
      - ./hf-cache:/home/aegis/.cache
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

volumes:
  postgres_data:
