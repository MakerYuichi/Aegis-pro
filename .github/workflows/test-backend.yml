name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/orchestrator/**'
      - '.github/workflows/test-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/orchestrator/**'
      - '.github/workflows/test-backend.yml'

jobs:
  pytest:
    name: pytest (full suite)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AUTH0_DOMAIN: test-tenant.us.auth0.com
      AUTH0_AUDIENCE: https://test-api
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aegis_test
      REDIS_URL: redis://localhost:6379/0
      DEMO_MODE: "true"
      LLM_PROVIDER: mock
      LLM_FALLBACKS: ""
      AUTO_FIX_MODE: read_only
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      OPENROUTER_API_KEY: ""
      AZURE_OPENAI_API_KEY: ""
      GITHUB_TOKEN: ""
      GITHUB_ORG: ""
      SLACK_BOT_TOKEN: ""
      SLACK_WEBHOOK_URL: ""
      SLACK_SIGNING_SECRET: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/orchestrator/requirements.txt

      - name: Install backend deps
        working-directory: backend/orchestrator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------
      # DIAGNOSTIC — remove once CI is green
      # ------------------------------------------------------------------
      - name: Verify services are reachable
        run: |
          echo "=== env DATABASE_URL ==="
          echo "$DATABASE_URL"
          echo "=== postgres container ==="
          docker ps --filter "ancestor=pgvector/pgvector:pg15"
          echo "=== pg_isready ==="
          pg_isready -h localhost -p 5432 -U postgres || true
          echo "=== psql connect ==="
          PGPASSWORD=postgres psql -h localhost -U postgres -d aegis_test -c "SELECT version();" || true
          echo "=== redis container ==="
          docker ps --filter "ancestor=redis:7-alpine"
          echo "=== redis ping ==="
          redis-cli -h localhost -p 6379 ping || true
          echo "=== listening sockets ==="
          ss -tlnp | grep -E ':(5432|6379)' || true
      # ------------------------------------------------------------------

      - name: Run full test suite
        working-directory: backend/orchestrator
        run: |
          python -m pytest tests/ -v --tb=short -m "not e2e"

      - name: Coverage report
        working-directory: backend/orchestrator
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=0

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/orchestrator/coverage.xml
          retention-days: 7
