name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - 'backend/orchestrator/**'
      - '.github/workflows/test-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/orchestrator/**'
      - '.github/workflows/test-backend.yml'

jobs:
  pytest:
    name: pytest (full suite)
    runs-on: ubuntu-latest
    

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aegis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Tests mock all external calls, but these need to be set so
      # the config doesn't fail on import.
      AUTH0_DOMAIN: test-tenant.us.auth0.com
      AUTH0_AUDIENCE: https://test-api
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aegis_test
      REDIS_URL: redis://localhost:6379/0
      DEMO_MODE: "true"
      LLM_PROVIDER: mock
      LLM_FALLBACKS: ""
      AUTO_FIX_MODE: read_only
      # All secrets empty — tests must not depend on them.
      GROQ_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      OPENROUTER_API_KEY: ""
      AZURE_OPENAI_API_KEY: ""
      GITHUB_TOKEN: ""
      GITHUB_ORG: ""
      SLACK_BOT_TOKEN: ""
      SLACK_WEBHOOK_URL: ""
      SLACK_SIGNING_SECRET: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/orchestrator/requirements.txt

      - name: Install backend deps
        working-directory: backend/orchestrator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full test suite
        working-directory: backend/orchestrator
        run: |
          python -m pytest tests/ -v --tb=short -m "not e2e"

      - name: Coverage report
        working-directory: backend/orchestrator
        run: |
          python -m pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=0

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/orchestrator/coverage.xml
          retention-days: 7
