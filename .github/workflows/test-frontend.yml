name: Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/test-frontend.yml'

jobs:
  typecheck-and-test:
    name: typecheck + vitest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders so Vite doesn't fail on missing env vars.
          # These are not real credentials — the build just needs them defined.
          VITE_API_URL: http://localhost:8000
          VITE_AUTH0_DOMAIN: test-tenant.us.auth0.com
          VITE_AUTH0_CLIENT_ID: test-client-id
          VITE_AUTH0_AUDIENCE: https://test-api

      # This step runs only after Issue 3 (Vitest setup) lands.
      # Remove the `if:` guard once `test:run` exists in package.json.
      - name: Vitest
        if: hashFiles('frontend/vitest.config.ts') != ''
        run: npm run test:run
