name: LLM Provider CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  test-llm-providers:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/orchestrator/requirements.txt

      - name: Install backend deps
        working-directory: backend/orchestrator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install redis-tools
        run: sudo apt-get update && sudo apt-get install -y redis-tools

      - name: Wait for Redis
        run: |
          for i in {1..15}; do
            if redis-cli -h localhost ping | grep -q PONG; then
              echo "Redis is up"
              exit 0
            fi
            sleep 1
          done
          echo "Redis did not start in time"
          exit 1

      - name: Run tests
        working-directory: backend/orchestrator
        env:
          LLM_PROVIDER: mock
          LLM_FALLBACKS: ""
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0
          AUTH0_DOMAIN: test-tenant.us.auth0.com
          AUTH0_AUDIENCE: https://test-api
        run: |
          pytest tests/ -v --tb=short
