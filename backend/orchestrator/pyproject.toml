[project]
name = "aegis-pro-orchestrator"
version = "0.1.0"
description = "Open-source AI incident commander that turns an alert into a reviewed fix PR."
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
authors = [
    { name = "MakerYuichi" },
]
keywords = ["incident-response", "sre", "devops", "fastapi", "rag", "llm", "pgvector"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
]

# ── pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]

# ── ruff (linter + formatter) ───────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E", "F"]

# ── black (formatter) ───────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py311"]

# ── mypy (type checker) ─────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "venv/", ".venv/"]
